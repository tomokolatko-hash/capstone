       ORIGINAL HOMEPAGE STYLES
       ===================================== */

    .highlight-divider {

      font-weight: normal;

    /* CAROUSEL BUTTON */

      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;

    /* =====================================
       COLLECTION GALLERIES
       ===================================== */

      width: 95%;
      max-width: 1500px;

      align-items: stretch;

    .section .gallery .product {

    .highlight-divider .overlay {

      z-index: 1;

      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: auto !important;

      overflow: visible;

    .highlight-divider .overlay h3 {

      font-size: 2.8rem;
      font-weight: normal;
      letter-spacing: 0;
      line-height: 1.5;
      color: #fff;

    /* ENGLISH ARTIST STATEMENT */
    .highlight-divider .overlay p {
      width: 100%;
      max-width: 850px;
      margin: 0;

      font-size: 1.05rem;
      font-weight: normal;
      line-height: 1.95;

      text-align: left;
      white-space: pre-line;
      overflow-wrap: break-word;
      color: #fff;

    /* =====================================
       JAPANESE ARTIST STATEMENT
       ===================================== */

      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.8rem;
      font-weight: 400;

       LANGUAGE SWITCH
       ===================================== -->

  <script>

    const translations = {
      "MOON POTTERY": "陶芸月",
      "Moon Pottery": "陶芸月",
      "HOME": "ホーム",
      "SHOP": "ショップ",
      "ABOUT": "私について",
      "CONTACT": "お問い合わせ",
      "Start Shopping": "ショップを見る",
      "Jar Collection": "小物入れコレクション",
      "Fruit Bowl Collection": "フルーツボウルコレクション",
      "Featured Collection": "注目のコレクション",
      "FAQs": "よくある質問",
      "PRESS ROOM": "プレスルーム",
      "© 2025 MOON POTTERY — ALL RIGHTS RESERVED.":
        "© 2025 ムーンポタリー — 無断転載を禁じます。"
    };

    /* ENGLISH ARTIST STATEMENT */

    const statementEnglish = `My late father named me Tomoko. The first character of my name, 朋, consists of two moon-shaped elements and means friendship. My father loved Confucius's Analects and carried it everywhere he went. He chose the kanji 朋 from the passage “有朋自遠方来、不亦楽乎” (“Is it not a pleasure to have friends come from afar?”). This may be why I am so attracted to round shapes like the full moon. I love repetitive designs and organic forms, creating patterns that reflect the passage of time.

Most of my work focuses on organic, repetitive patterns, simplicity, and the concept of Memento Mori, the reminder that life is temporary and everything eventually changes or disappears. This idea also connects to the Buddhist concept of impermanence (無常) and the Japanese aesthetic of Wabi-Sabi (侘び寂び), which finds beauty in simplicity and imperfection.

I reflect on memory and time through the repeated process of making marks. I hope my ceramic pieces will remain after I am gone, carrying traces of my thoughts and love for my family into the future.`;

    /* JAPANESE ARTIST STATEMENT */

    const statementJapanese = `私の名前「朋子」は、亡き父がつけてくれたものです。「朋」という漢字は、月の形をした二つの部分から成り、友情を意味します。父は孔子の『論語』を愛読し、いつも持ち歩いていました。「朋」という字は、「有朋自遠方来、不亦楽乎」（朋あり遠方より来たる、また楽しからずや）という一節から選んだそうです。

私が満月のような丸い形に強く惹かれるのも、そのためかもしれません。私は繰り返しのデザインや有機的な形を好み、時間の流れを映し出す模様を制作しています。

私の作品の多くは、有機的な形、反復する模様、シンプルさ、そして「メメント・モリ（Memento Mori）」という概念を中心にしています。メメント・モリとは、人生は永遠ではなく、すべてのものはやがて変化し、消えていくということを思い起こさせる言葉です。

この考えは、仏教の「無常」や、簡素さや不完全さの中に美を見いだす日本の美意識「侘び寂び」にもつながっています。

私は、繰り返し模様を刻む制作過程を通して、記憶と時間について思いを巡らせています。そして、私がこの世を去ったあとも、私の陶芸作品が残り、家族への思いや愛情の痕跡を未来へと伝えてくれることを願っています。`;

    /* REMEMBER SELECTED LANGUAGE */

    let isJapanese = false;

    try {
      isJapanese =
        localStorage.getItem("moonPotteryLanguage") === "ja";
    } catch (error) {
      isJapanese = false;
    }

    /* UPDATE LANGUAGE */

    function updateLanguage() {

      document.querySelectorAll("[data-en]")
        .forEach(function(element) {

          const english =
            element.getAttribute("data-en");

          element.textContent = isJapanese
            ? (translations[english] || english)
            : english;

        });

      /* ARTIST NAME */
      document.getElementById("statement-name").textContent =
        isJapanese ? "山田朋子" : "Tomoko Latko";

      /* ARTIST STATEMENT */
      document.getElementById("artist-statement").textContent =
        isJapanese ? statementJapanese : statementEnglish;

      /* JAPANESE STYLING */
      document.body.classList.toggle(
        "japanese-mode",
        isJapanese
      );

      /* LANGUAGE BUTTON */
      document.getElementById("toggle-lang").textContent =
        isJapanese ? "English" : "日本語";

      document.documentElement.lang =
        isJapanese ? "ja" : "en";

    }

    /* LANGUAGE BUTTON EVENT */

    document.getElementById("toggle-lang")
      .addEventListener("click", function() {

        isJapanese = !isJapanese;

        try {
          localStorage.setItem(
            "moonPotteryLanguage",
            isJapanese ? "ja" : "en"
          );
        } catch (error) {
          // Language switching still works.
        }

        updateLanguage();

      });

    /* INITIAL DISPLAY */
    updateLanguage();

  </script>
